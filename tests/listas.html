<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba de Listas</title>
</head>
<body>
<h1>Listas Ordenadas y No Ordenadas</h1>
<h2>Lista no ordenada con sublistas</h2>
<ul>
    <li>Lenguajes compilados
        <ul>
            <li>Java</li>
            <li>C++</li>
        </ul>
    </li>
    <li>Lenguajes interpretados
        <ol>
            <li>Python</li>
            <li>JavaScript</li>
        </ol>
    </li>
</ul>

<h2>Lista ordenada</h2>
<ol>
    <li>Analizar requisitos</li>
    <li>Diseñar arquitectura</li>
    <li>Implementar y probar</li>
</ol>
</body>
</html>
